<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My feelings ♥</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="game-label">KITTY </div>

        <h1>¡I LOVE YOU!</h1>

        <div class="cat-container">
            <canvas id="cat" width="180" height="180"></canvas>
            <div class="hearts">♥ &nbsp; ✦ &nbsp; ♥</div>
        </div>

        <div class="message-box">
            <h2 id="greeting">¡I open my heart to show you my soul!</h2>
            <p id="personal-message">
                I could take the stars from the sky for you,
                or the sun, or the moon, if you wanted me to.
                But I’d rather take my love and give it to you,
                because stars, sun and moon will fade away,
                but my love for you is here to stay.
            </p>
        </div>

        <div class="customizer">
            <button id="update-button">
                ¡jump cat!
            </button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
